interface:
  display_name: "AI Job Search & Fit Scorer"
  short_description: "Search and score developer jobs with fit evidence"
  default_prompt: "Use $ai-job-fit-scorer to search developer jobs or score a supplied job list for one candidate, then present the shortlist with delivery scores, fit scores, blocking gates, and gaps."

dependencies:
  tools:
    - type: "mcp"
      value: "apify"
      description: "Inspect compatibility, call scorer latest and bind the returned immutable build, validate RUN-SUMMARY v4, and retrieve its dataset"
      transport: "streamable_http"
      url: "https://mcp.apify.com?tools=fetch-actor-details,call-actor,get-actor-run,get-dataset-items,get-key-value-store-record"
