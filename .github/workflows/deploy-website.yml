name: Deploy website and notify search engines

on:
  push:
    branches:
      - main
    paths:
      - ".firebaserc"
      - ".github/workflows/deploy-website.yml"
      - "firebase.json"
      - "integrations/shared/nomad-ai-job-fit-*.schema.json"
      - "scripts/search_publish.py"
      - "tests/test_search_publish.py"
      - "tests/test_website.py"
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and submit search discovery
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://jobatlas.dev/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate required secrets
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import re

          indexnow_key = os.environ.get("INDEXNOW_KEY", "")
          if not re.fullmatch(r"[A-Za-z0-9-]{8,128}", indexnow_key):
              raise SystemExit("INDEXNOW_KEY must contain 8-128 letters, numbers, or dashes")
          PY

      - name: Prepare sitemap, robots, and IndexNow ownership file
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python3 scripts/search_publish.py prepare

      - name: Verify generated public artifacts are committed
        run: |
          generated_status="$(git status --porcelain=v1 --untracked-files=all -- website/sitemap.xml website/robots.txt website/contracts)"
          if [ -n "$generated_status" ]; then
            echo "Generated search artifacts differ from the committed files:"
            echo "$generated_status"
            exit 1
          fi

      - name: Run repository tests
        run: python3 -m unittest discover -s tests -v

      - name: Install Google authentication client
        run: python3 -m pip install "google-auth[requests]>=2.38,<3"

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: hryu-jobs
          workload_identity_provider: projects/783418209706/locations/global/workloadIdentityPools/github-actions/providers/nomad-agent-job-scrapers
          service_account: github-nomad-agent-web@hryu-jobs.iam.gserviceaccount.com

      - name: Verify Search Console property access
        run: python3 scripts/search_publish.py preflight

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.28.1

      - name: Deploy isolated Firebase Hosting site
        run: firebase deploy --only hosting --project hryu-jobs --non-interactive

      - name: Verify live pages and notify Google and Bing
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python3 scripts/search_publish.py notify

      - name: Record deployment evidence
        run: |
          {
            echo "## Job Atlas website deployment"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Canonical origin: https://jobatlas.dev/"
            echo "- Live HTML: byte-matched before search notification"
            echo "- Search notification: see the preceding step; acceptance is not indexing proof"
          } >> "$GITHUB_STEP_SUMMARY"
